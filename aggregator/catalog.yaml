# 统一模型目录：模型 -> 能力契约 -> 上游线路 -> 价格（price = 对外零售，cost = 上游批发）
# 价格口径：RMB。积分 = RMB × 10（沿用刀徒的 1 元 = 10 积分）。
models:
  # ================= 真实渠道（有 key 即真实调用、真实扣费） =================
  # 价格为公开标价的近似值，内部自用按成本记账（price = cost）；以各家账单为准。
  # api_id 是上游的真实模型名，上线前用 tools/probe_models.py 核对一遍。
  - id: deepseek-chat
    type: chat
    context: 128000
    unit: tokens
    price: { input_rmb_per_m: 2.0, output_rmb_per_m: 8.0 }
    cost: { input_rmb_per_m: 2.0, output_rmb_per_m: 8.0 }
    routes:
      - { provider: deepseek, api_id: deepseek-chat, weight: 2 }
      - { provider: dashscope, api_id: deepseek-v4-pro, weight: 1 }   # 百炼上的 DeepSeek 做备用线路

  - id: qwen-plus
    type: chat
    context: 128000
    unit: tokens
    price: { input_rmb_per_m: 0.8, output_rmb_per_m: 2.0 }
    cost: { input_rmb_per_m: 0.8, output_rmb_per_m: 2.0 }
    routes:
      - { provider: dashscope, api_id: qwen-plus, weight: 1 }

  # 火山方舟文本模型需要先在控制台“开通模型”，2026-10-31 实测 doubao-seed-1-6 / deepseek-v3-1 均返回 404（未开通），暂不挂。

  # ---- 火山方舟 · 图像（2026-10-31 实测已开通：Seedream 5.0 Pro / Flash；4.0、4.5 未开通）----
  - id: seedream-5.0-flash
    type: image
    unit: image
    price: { rmb_per_image: 0.2 }      # 估算，以火山账单为准
    cost: { rmb_per_image: 0.2 }
    routes:
      - { provider: volcengine_official, api_id: doubao-seedream-5-0-flash-260915, weight: 1 }

  - id: seedream-5.0-pro
    type: image
    unit: image
    price: { rmb_per_image: 0.3 }
    cost: { rmb_per_image: 0.3 }
    routes:
      - { provider: volcengine_official, api_id: doubao-seedream-5-0-pro-260628, weight: 1 }

  # ---- 火山方舟 · 视频（2026-10-31：全部“未开通”，需在火山方舟控制台 → 开通管理 里开通后才能用）----
  # 价格按刀徒同规格的售价估算（偏保守，用来卡预算），以火山账单为准。
  - id: ark-seedance-2.0-fast
    type: video
    unit: output_second
    price: { rmb_per_second: { 480P: 0.40, 720P: 0.90, 1080P: 2.00 } }
    cost: { rmb_per_second: { 480P: 0.40, 720P: 0.90, 1080P: 2.00 } }
    specs: [480P, 720P, 1080P]
    duration: { min: 4, max: 15, step: 1 }
    modes: [文生视频, 首帧参考, 全能参考]
    routes:
      - { provider: volcengine_official, api_id: doubao-seedance-2-0-fast-260128, weight: 1 }

  - id: ark-seedance-2.0
    type: video
    unit: output_second
    price: { rmb_per_second: { 480P: 0.55, 720P: 1.20, 1080P: 2.80 } }
    cost: { rmb_per_second: { 480P: 0.55, 720P: 1.20, 1080P: 2.80 } }
    specs: [480P, 720P, 1080P]
    duration: { min: 4, max: 15, step: 1 }
