  # ---------------- 视频（按输出秒计费） ----------------
  - id: seedance-2.5
    type: video
    unit: output_second
    price:
      rmb_per_second:
        480P: 0.80     # 实测：刀徒视频页显示 "480P (8 积分/秒)" = ¥0.80/s
        720P: 1.75
        1080P: 4.30
    cost:
      rmb_per_second:
        480P: 0.672    # 火山方舟官方：5s 480P ≈ ¥3.36
        720P: 1.512    # 5s 720P ≈ ¥7.56
        1080P: 3.742   # 5s 1080P ≈ ¥18.71
    specs: [480P, 720P, 1080P]
    duration: { min: 4, max: 30, step: 1 }
    modes: [文生视频, 首帧参考, 全能参考]
    routes:
      - { provider: ch_ai_video,  api_id: rd-seedance-2.5-480p,  spec: 480P, group: RD渠道, weight: 2 }
      - { provider: ch_ai_video,  api_id: seedance-2.5-480p,     spec: 480P, group: 纯血,   weight: 1 }
      - { provider: custom_api_1, api_id: seedance2.5-A,         spec: 480P, group: default, weight: 1,
          cost: { rmb_per_second: { 480P: 0.62 } } }
      - { provider: ch_ai_video,  api_id: hd-seedance-2.5-480p,  spec: 480P, group: default, weight: 1 }
