# 统一模型目录：模型 -> 能力契约 -> 上游线路 -> 价格（price = 对外零售，cost = 上游批发）
# 价格口径：RMB。积分 = RMB × 10（沿用刀徒的 1 元 = 10 积分）。
models:
  # ================= 真实渠道（有 key 即真实调用、真实扣费） =================
  # 价格为公开标价的近似值，内部自用按成本记账（price = cost）；以各家账单为准。
  # api_id 是上游的真实模型名，上线前用 tools/probe_models.py 核对一遍。
  - id: deepseek-chat
    type: chat
    context: 128000
    unit: tokens
    price: { input_rmb_per_m: 2.0, output_rmb_per_m: 8.0 }
    cost: { input_rmb_per_m: 2.0, output_rmb_per_m: 8.0 }
    routes:
      - { provider: deepseek, api_id: deepseek-chat, weight: 2 }
      - { provider: dashscope, api_id: deepseek-v4-pro, weight: 1 }   # 百炼上的 DeepSeek 做备用线路

  - id: qwen3-vl-plus          # 视觉理解：自动质检用（看抽帧 + 定版图）
    type: chat
    context: 128000
    unit: tokens
    price: { input_rmb_per_m: 1.0, output_rmb_per_m: 10.0 }   # 32K 内档位（第三方价目，以百炼为准）
    cost: { input_rmb_per_m: 1.0, output_rmb_per_m: 10.0 }
    routes:
      - { provider: dashscope, api_id: qwen3-vl-plus, weight: 1 }

  - id: qwen3-tts-flash         # 语音合成：配音 / 旁白（48 个音色，含方言；单次 ≤600 字）
    type: tts
    unit: char
    price: { rmb_per_10k_chars: 0.8 }   # 估算，以百炼账单为准
    cost: { rmb_per_10k_chars: 0.8 }
    routes:
      - { provider: dashscope_tts, api_id: qwen3-tts-flash, weight: 1 }

  - id: qwen-plus
    type: chat
    context: 128000
    unit: tokens
    price: { input_rmb_per_m: 0.8, output_rmb_per_m: 2.0 }
    cost: { input_rmb_per_m: 0.8, output_rmb_per_m: 2.0 }
    routes:
      - { provider: dashscope, api_id: qwen-plus, weight: 1 }

