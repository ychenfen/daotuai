# 工作台：只能通过 HTTPS + 访问密码进来；后端只监听 127.0.0.1。
# __DOMAIN__ 由 install.sh 替换；证书由 certbot 写入下面的 443 段。
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    auth_basic "daotuai";
    auth_basic_user_file /etc/nginx/daotuai.htpasswd;

    client_max_body_size 1024m;          # 上传剧本、素材、音频
    proxy_read_timeout 1800s;            # 一键成片、批量出图会跑很久
    proxy_send_timeout 1800s;

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;             # 流式输出（对话、进度）
    }
}
