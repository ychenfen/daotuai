# 工作台挂在已有站点的子路径下（__PATH__），由 install.sh 写到 /etc/nginx/snippets/daotuai-studio.conf，
# 再在该站点 443 的 server 块里 include。后端只监听 127.0.0.1:8011。
location = __PATH__ { return 301 __PATH__/ui/; }
location = __PATH__/ { return 301 __PATH__/ui/; }
location = __PATH__/ui { return 301 __PATH__/ui/; }
location __PATH__/ {
    auth_basic "daotuai";
    auth_basic_user_file /etc/nginx/daotuai.htpasswd;
    proxy_pass http://127.0.0.1:8011/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix __PATH__;
    proxy_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    client_max_body_size 1024m;
}
